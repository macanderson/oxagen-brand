name: ui

# The site and the component kit. Every pull request, and every push to main,
# runs the brand checks (the build, the message registry, the webfonts, and the
# branding skill), the kit's typecheck and unit tests, a static Storybook, and
# the design-system bundle. The last two upload as artifacts. A push to main
# then deploys the whole site, Storybook included, to brand.oxagen.cloud, once
# every job has passed. Agents read the brand from main, so a push to main
# that fails a check never deploys.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: ui

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # hb-shape reproduces the wordmark, and rsvg-convert renders the marks.
      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libharfbuzz-bin librsvg2-bin
          python -m pip install --quiet fonttools brotli pyyaml
      - run: python build/build.py --check
      - name: Test the theme request and apply scripts
        run: python -m unittest discover -s build -p "test_*.py" -v
      - run: python build/messages.py --check
      - run: python build/fonts.py --check
      - run: python build/skill.py --check
      - name: Install the skill stub into a scratch project
        run: |
          dir=$(mktemp -d)
          sh skills/install.sh --project "$dir"
          sh skills/install.sh --check --project "$dir"

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: ui/storybook-static/
          if-no-files-found: error
          retention-days: 14

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ui/.node-version
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:design-system
      # The Claude Design project loads these three paths. A build that drops
      # one would upload a bundle the project cannot read.
      - name: Check the bundle
        run: |
          for f in components/bundle.js bundle.css index.d.ts; do
            test -s "design-system/$f" || { echo "::error::design-system/$f is missing or empty."; exit 1; }
          done
          grep -q "OxagenUI" design-system/components/bundle.js || { echo "::error::bundle.js does not set window.OxagenUI."; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-bundle
          path: ui/design-system/
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, typecheck, test, storybook, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://brand.oxagen.cloud
    defaults:
      run:
        working-directory: .
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # A deploy with no credentials would fail deep inside the Vercel CLI. This
      # step names the missing secrets instead, and it fails the job so a main
      # push with no deploy never reads green.
      - name: Check the Vercel secrets
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets to deploy brand.oxagen.cloud:$missing"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ui/.node-version
      # sdlc/ is its own Vercel project (oxagen-sdlc). It is removed from this
      # checkout rather than listed in .vercelignore, because the oxagen-sdlc
      # build reads the root .vercelignore too, and a /sdlc/ line there left
      # that build with no files.
      - name: Leave out the SDLC site
        run: rm -rf sdlc
      - name: Deploy to Vercel
        run: npx --yes vercel@61.0.0 deploy --prod --yes --token "$VERCEL_TOKEN"
