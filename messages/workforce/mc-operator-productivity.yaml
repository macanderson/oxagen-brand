title: Measure what each operator's agents finished.
short: Read the work orders each operator's agents finished, what each cost, and the share of spend that bought no progress.
long: More agents per operator is better when finished work grows and unproductive spend does not. The operator metrics show both sides. Read the work orders done, the cost per done work order, the agents in flight, and how many times the operator stepped in per done work order. The unproductive share sits beside them as the check on growth. A work order counts as done when the checks in each item's definition of done held.
cta: Read an operator's metrics
