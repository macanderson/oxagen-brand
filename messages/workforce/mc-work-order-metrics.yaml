title: Read what each work order cost to finish.
short: See the done rate, first-pass rate, cost and time to done, rework spend, and abandoned spend.
long: A work order carries a definition of done, so Oxagen can count what finished and what it cost. Read the done rate, the share done on the first pass, and the cost and time to done. See the spend on rework after a failed check, the spend on work orders closed without finishing, and how often done work orders reopen. Each figure opens to the runs and requests behind it.
