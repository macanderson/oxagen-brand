title: Rank operators by unproductive spend.
short: Show a manager which operators spend the most on steps that bought no progress.
long: A manager needs to know which operators spend the most on steps that bought no progress. Spend ranks operators by that one measured figure. Beside each name sit the unproductive share of their spend, the work orders they finished, and the share of their spend filed under no work item. Each figure opens to the requests it came from. The ranking reports a measurement. It does not grade the person.
