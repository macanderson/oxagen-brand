notes: 'Source: finding-wasted-spend.html in this kit. The spend review of 2026-09-27 decided four things behind this line. A repeated step is priced at the request that carried it. A no-progress limit runs in observe mode by default. Each tool provider and steering record shows a weekly price. The headline total counts only whole requests. Unproductive spend replaces wasted spend as the term.'
