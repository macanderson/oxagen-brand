qualifier: Counts whole recorded requests for runs routed through Oxagen. Savings are stated only for measured workloads under stated conditions.
evidence: 'Product owner: show one finding of each kind with the requests behind it, the rate source, and the rule that flagged it. Finance owner: reconcile the unproductive total to the recorded spend and name the exclusions. Make no savings claim without the measured workload.'
