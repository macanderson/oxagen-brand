id: mc-unproductive-spend
brand: oxagen
kind: card
order: 17
title: See the spend that bought no progress.
short: Find the repeated calls, idle waits, and oversized models that added cost without moving the work.
long: Oxagen reads the recorded requests for steps that cost money and moved nothing. A status poll returns the same answer call after call. A cache expires while a parent run waits on its child. A model class larger than the job answers a lookup. Each finding names the requests behind it and the rate that priced them. Unproductive spend shows as its own line beside the total, and it counts whole recorded requests only.
cta: Open an unproductive spend finding
