order: 21
title: See the spend no one filed under the work.
short: Find the tokens spent on runs with no work item behind them.
long: Each recorded run belongs to a work order. A run started outside Oxagen gets a direct work order of its own. When that work order has no work item, its spend counts as unassigned. Oxagen shows unassigned spend as its own line, apart from unproductive spend, by operator, agent, and workspace, so a manager can ask what the work was.
