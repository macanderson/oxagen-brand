title: Find the expensive habit. See what to change.
short: Spot unused cache writes, oversized tool lists, repeated calls, and provider retries, with their cost attached.
long: Oxagen turns recorded spend into specific findings. See which change invalidated a cache, which tool definitions consumed prompt space without being used, or where repeated calls added cost. Each finding links to the recorded calls behind it and the cost they added, so you can choose what to fix first.
