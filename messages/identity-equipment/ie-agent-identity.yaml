title: Give each agent an identity you can govern.
short: Register each agent as a principal in a supported identity system, with its own roles, scope, and accountable operator.
long: Each agent has a named place in your identity and access management system. Assign its roles, limit the resources it can request, and keep delegated authority within the operator's own permissions. Review its activity under that identity, and suspend or revoke its authority when its responsibility changes.
