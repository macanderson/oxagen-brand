title: Decide which tools belong in each agent's hands.
short: Manage the tool catalog and control which tools each agent can discover and request.
long: Equip agents for their responsibilities from a governed tool catalog. Set access by role and scope, then inspect the toolbelt the agent actually sees. Each request still meets your rules before the action proceeds. A tool's presence in the catalog does not grant every agent permission to use it.
