id: dod-not-your-call
brand: oxagen
kind: card
order: 18
title: The agent doesn't get to decide it's done.
short: When the agent tries to stop, Oxagen runs the checks. A broken check sends it back with a specific reason.
long: The agent reaches a stopping point. The wrapper runs the locked checks where the agent works. If they break and retries remain, it blocks the stop and returns the failing check IDs so the agent can continue. If retries run out, the run ends broken with its reasons recorded. Done means the specified checks held, and your team decides whether those checks are enough.
cta: Watch a blocked stop
