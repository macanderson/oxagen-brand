id: rule-agent-runners-name
brand: oxagen
kind: rule
order: 20
title: Oxagen Agent Runners is the name of the add-on.
long: Say Oxagen Agent Runners for the add-on, cloud runtime for what a workspace sets up, and sandbox for the machine each run gets. Add no new name that says tacho.
audience:
  - operator
  - platform
  - engineering
clause: none
surfaces:
  - copy-rules
  - add-on-page
  - pricing-page
  - docs
  - app
status: approved
release: held
gate:
  - agent-runners-release
owner: Mac Anderson
review_by: '2026-10-15'
findings:
  - '07'
notes: 'Mac settled the name and both terms on 2026-10-02, in the Decisions table of the Oxagen Agent Runners spec (oxageninc/roadmap, initiatives/cloud-agent-runners/oxagen-agent-runners-spec.html). The gate agent-runners-release opens when lane R6, the release live test, passes: a customer-like workspace on the Build plan runs end to end, and its invoice shows the sandbox-hours. Until then the name stays out of the site, ads, and outreach. The candidate line and description are agent-runners-line and agent-runners-description.'
