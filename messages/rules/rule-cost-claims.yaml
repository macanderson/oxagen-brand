id: rule-cost-claims
brand: oxagen
kind: rule
order: 8
title: Show cost. Claim savings only from a measurement.
long: Cost visibility is a launch claim. A saving is stated only for a measured workload under stated conditions, with the baseline named. Make no comparison with model providers.
