id: rule-identity-credentials
brand: oxagen
kind: rule
order: 5
title: Identity and credentials are separate claims.
long: Each agent has its own identity. For mediated connections, Oxagen uses the connection credential on the agent's behalf and the agent does not receive it. Make no promise about what an agent cannot leak.
phrases:
- nothing for the agent to leak
- nothing for it to leak
- never sees the key
- never sees the credential
audience:
- operator
- platform
clause: none
