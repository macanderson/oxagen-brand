notes: 'This entry names who signs, not who the product speaks to on the homepage. The operator stays the primary user audience and the reader of most copy. The full statement, the qualifying and disqualifying signals, and the opening questions are in skills/oxagen-branding/references/positioning.md under The buyer we are built for.'
