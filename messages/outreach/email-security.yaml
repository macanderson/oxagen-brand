kind: email
order: 3
title: Which identity and rule authorized that agent action?
long: |-
  When an agent requests an action, can your team connect it to the agent's identity, the authority it was assigned, and the person responsible?

  Oxagen applies your rules to requests handled through the platform and records the decision. A walkthrough shows the agent's mandate, a denied request, one routed to a person, and the record each leaves.
cta: Inspect an agent's authority
audience:
- security
clause: access
surfaces:
- sales-email
status: approved
release: launch
qualifier: Requests handled through the platform.
evidence: 'Sales owner: confirm the demo exists. Founder: date and substantiate partner counts. Customer owner: obtain attribution permission before publishing an actual testimonial. Do not promise the demo on a prospect’s repositories without agreed setup. Platform owner: demonstrate allow, deny, approval, missing-rule, observe-mode, and outage cases for each supported integration. Identify requests outside that boundary.'
