title: Set the terms your agents work under.
short: Set access, budget, rules, tools, and steering in one mandate, whichever team owns each part.
long: A mandate is the one object an agent works under. It names what the agent may request, what it may spend, and which tools and instructions it may use. Oxagen checks those terms on governed calls and records the decision, so the people setting the limits can see how they were applied.
