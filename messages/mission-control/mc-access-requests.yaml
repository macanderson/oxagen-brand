id: mc-access-requests
brand: oxagen
kind: card
order: 3
title: Answer each request when the agent makes it.
short: The agent requests an action. Your rule allows it, denies it, or routes it to a person. For mediated connections, the credential stays in Oxagen.
long: A read from GitHub and a push to a protected branch deserve different answers. For actions routed through Oxagen, each request meets the rules your team wrote. When an allowed request uses a mediated connection, Oxagen uses the connection credential on the agent's behalf, and the agent does not receive it. You can read what the agent requested, which rule answered, and who signed an approval.
cta: Follow an access request
