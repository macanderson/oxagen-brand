id: access-section-example
brand: oxagen
kind: section
order: 9
title: Product page, the access section
rows:
- label: Don't hand your agents the keys.
  text: An agent under Oxagen has its own identity and a mandate. For mediated connections, it does not receive a token to GitHub or a password to the database. When a task needs one of those systems, the agent asks. The request carries who started the task, which agent is asking, which tool it wants, and which data it would reach.
- label: A rule you wrote answers.
  text: 'The team that owns the system writes the rule. Reads of the public repo: allowed. A push to main: denied. A push to a release branch: routed to the release owner, who sees the request with the diff beside it and answers from the Access page. Allowed and denied requests settle inside the same call. Routed requests wait for the person, and the run waits with them.'
- label: For mediated connections, the credential stays in Oxagen.
  text: 'Oxagen holds the credential and makes the connection on the agent''s behalf when a rule allows the request. The agent does not receive the credential. The record shows each use: the request, the rule that answered it, and the person who signed it.'
