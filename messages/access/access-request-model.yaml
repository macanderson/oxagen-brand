title: The request model
long: The usual model hands the agent a token with everything it might ever need and hopes it uses only some of it. Oxagen's model is a request. The agent holds its own identity and a mandate. When a task needs a system, a scope, or an action the mandate does not already cover, the agent asks for it at the moment of use.
