id: keys-credential-stays
brand: oxagen
kind: rule
order: 5
title: For mediated connections, the credential stays in Oxagen.
long: Oxagen uses the connection credential on the agent's behalf and the agent does not receive it. The agent's own identity and authentication are separate from that downstream credential. Say where the credential is held and what the record shows, and make no promise about what cannot leak.
