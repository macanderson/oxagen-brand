title: Don't hand your agents the keys.
short: The agent asks. A rule you wrote answers. For mediated connections, the credential stays in Oxagen.
long: An agent under Oxagen has its own identity and a mandate. When a task needs a system, a scope, or an action the mandate does not already cover, the agent asks for it at the moment of use. A rule allows the request, denies it, or routes it to a person, and the record keeps the answer. For mediated connections, Oxagen uses the connection credential on the agent's behalf, and the agent does not receive it.
