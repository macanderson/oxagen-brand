title: Follow the action back to its authority.
long: Review which agent requested an action, on whose behalf, which rule answered, and who approved it when a person was required. Inspect the recorded result and cost alongside that decision. For runs with completion checks, export the record so another person can recompute the recorded verdict without an Oxagen account or network connection.
