title: Manage the agents. Coach the operators.
long: |-
  The mandate sets what an agent may do. The review shows how the person working with it spends the budget and how they ask. Read the spend by operator, agent, and workspace, then read the habits behind it: turns to completion, restarts on the same task, steering overridden by hand instead of written as a rule. Each habit carries its definition and one recommendation, worded as a rule the operator can adopt.
