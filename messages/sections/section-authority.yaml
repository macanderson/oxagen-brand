id: section-authority
brand: oxagen
kind: section
order: 1
title: Set the authority behind each action.
long: Give each agent its own identity in your identity and access management system. Set which actions it may request and which resources it may reach. For actions handled through Oxagen, rules allow the request, deny it, or route it to a person. The record connects the decision to the agent and the person responsible for its work.
