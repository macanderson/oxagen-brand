title: Oxagen Agent Runners description
long: Each operator starts runs on their own agents, with one command or from the web app. Each run gets its own sandbox on a host Oxagen operates, so the laptop does none of the work. For model calls, Oxagen attaches the operator's credential at its gateway, and the sandbox gets a run token.
