evidence: 'Product owner: R6 passes. On the Build plan, an operator adds a credential, launches a run from the web, attaches to its terminal, and pauses and resumes it. The invoice shows the sandbox-hours, and they match the host records. Engineering: an inspection of a sandbox finds no model credential (M11).'
owner: product owner
review_by: '2026-10-15'
findings:
