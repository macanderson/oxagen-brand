notes: 'The short description for Oxagen Agent Runners. Mac chose it on 2026-10-03 from the lane B1 candidates (B1 variant). The credential sentence covers model credentials only: the gateway attaches the operator''s credential to each model call, and the sandbox gets a run token. It does not say the sandbox holds only a run token, because a workspace environment and its secrets are injected into the sandbox at launch. A template that hands the harness root still runs, so the description makes no claim about containment.'
