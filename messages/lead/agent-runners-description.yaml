title: Oxagen Agent Runners description
long: Set up a cloud runtime in your workspace. Each operator then starts runs on their own agents, from one command or the web app. Each run gets its own sandbox on a host Oxagen operates. Oxagen checks each launch against your rules and the agent's budget, and the operator's model credential stays in Oxagen, outside the sandbox.
