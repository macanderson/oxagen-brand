  - '04'
notes: 'The short description for Oxagen Agent Runners, a candidate for Mac, written 2026-10-03 in lane B1. The launch check is scoped to the launch, as the spec runs it (rule, budget, credential on file). The credential sentence covers model credentials only, because a workspace environment and its secrets are injected into the sandbox at launch. A template that hands the harness root still runs, so the description makes no claim about containment.'
