title: Tie the payment to the result.
short: Define the outcome that releases funding and link the release to its Witness evidence.
long: For outcome-funded work, set the required result in the witness record before the work begins. A qualifying Witness result triggers the funding release and links the metered outcome to its signed evidence. The payment record shows what earned it and which checks established the result.
